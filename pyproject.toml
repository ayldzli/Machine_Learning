[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ML_Library"
version = "0.1.0"
description = "YZM1022 İleri Programlama Dönem Projesi - Makine Öğrenmesi Kütüphanesi"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

